<svg width="100%" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <style>
    .cmd { font: 16px 'Fira Code', 'Courier New', monospace; fill: #58A6FF; font-weight: bold; }
    .out { font: 16px 'Fira Code', 'Courier New', monospace; fill: #E6EDF3; }
    .cursor { fill: #58A6FF; }
  </style>
  <rect width="800" height="280" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <circle cx="20" cy="20" r="6" fill="#FF5F56"/>
  <circle cx="40" cy="20" r="6" fill="#FFBD2E"/>
  <circle cx="60" cy="20" r="6" fill="#27C93F"/>
  <text x="400" y="25" fill="#8B949E" font-family="sans-serif" font-size="14" text-anchor="middle">terminal</text>
  
  <text class="cmd" x="20" y="70">&gt; sahitya0xsingh.status()</text>
  <text class="out" x="20" y="100">"Currently executing secretive disruptive tech..."</text>
  
  <text class="cmd" x="20" y="140">&gt; sahitya0xsingh.interests()</text>
  <text class="out" x="20" y="170">["Open Source", "System Architecture", "Deciphering Complex Systems"]</text>
  
  <text class="cmd" x="20" y="210">&gt; sahitya0xsingh.collaborate()</text>
  <text class="out" x="20" y="240">"Awaiting incoming connections for open-source hacking."</text>
  
  <text class="cmd" x="20" y="270">&gt; </text>
  <rect class="cursor" x="35" y="256" width="10" height="18">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
