<svg width="100%" height="140" viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg">
  <style>
    .quote { font: bold 26px sans-serif; text-anchor: middle; }
  </style>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <text class="quote" x="50%" y="60">
      "First, solve the problem.
      <animate attributeName="fill" values="#58A6FF;#ffffff;#58A6FF" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite" />
    </text>
    <text class="quote" x="50%" y="100">
      Then, write the code." — John Johnson
      <animate attributeName="fill" values="#ffffff;#58A6FF;#ffffff" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" />
    </text>
  </g>
</svg>
