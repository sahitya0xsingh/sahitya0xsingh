# Draws the 3D contribution graph and the contribution snake once a day.
name: profile visuals

on:
  schedule:
    - cron: "10 18 * * *"   # 23:40 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff7a59&color_dots=#161b22,#3b1f4a,#7b2c5e,#c2410c,#ff9a3c

      - name: Commit
        run: |
          mkdir -p assets && cp dist/snake-*.svg assets/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib assets
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: redraw 3D graph and snake"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
